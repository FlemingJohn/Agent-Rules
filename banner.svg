<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Agent Rules</title>
  <desc id="description">Rules for coding agents so the code they write is modular, simple and easy to read.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)"/>

  <g fill="none" stroke="#334155" stroke-width="2">
    <rect x="960" y="48" width="64" height="80" rx="8"/>
    <rect x="1036" y="48" width="64" height="80" rx="8"/>
    <rect x="1112" y="48" width="40" height="80" rx="8" stroke-dasharray="6 6"/>
  </g>
  <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round">
    <line x1="972" y1="68" x2="1004" y2="68"/>
    <line x1="1048" y1="68" x2="1080" y2="68"/>
  </g>
  <g stroke="#475569" stroke-width="3" stroke-linecap="round">
    <line x1="972" y1="84" x2="1012" y2="84"/>
    <line x1="972" y1="98" x2="996" y2="98"/>
    <line x1="1048" y1="84" x2="1088" y2="84"/>
    <line x1="1048" y1="98" x2="1072" y2="98"/>
  </g>

  <text x="80" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="64" font-weight="700" fill="#f8fafc">Agent Rules</text>
  <rect x="80" y="146" width="72" height="4" rx="2" fill="#38bdf8"/>
  <text x="80" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="24" fill="#94a3b8">Modular, simple, readable code from every coding agent</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#e2e8f0" text-anchor="middle">
    <g fill="#1e293b" stroke="#334155" stroke-width="1.5">
      <rect x="80" y="226" width="86" height="36" rx="18"/>
      <rect x="176" y="226" width="124" height="36" rx="18"/>
      <rect x="310" y="226" width="124" height="36" rx="18"/>
      <rect x="444" y="226" width="76" height="36" rx="18"/>
      <rect x="530" y="226" width="95" height="36" rx="18"/>
      <rect x="635" y="226" width="66" height="36" rx="18"/>
      <rect x="711" y="226" width="95" height="36" rx="18"/>
      <rect x="816" y="226" width="95" height="36" rx="18"/>
      <rect x="921" y="226" width="57" height="36" rx="18"/>
      <rect x="988" y="226" width="114" height="36" rx="18"/>
    </g>
    <text x="123" y="249">Python</text>
    <text x="238" y="249">TypeScript</text>
    <text x="372" y="249">JavaScript</text>
    <text x="482" y="249">React</text>
    <text x="577.5" y="249">Next.js</text>
    <text x="668" y="249">Node</text>
    <text x="758.5" y="249">Express</text>
    <text x="863.5" y="249">FastAPI</text>
    <text x="949.5" y="249">SQL</text>
    <text x="1045" y="249">LangGraph</text>
  </g>
</svg>
